name: ci

# Runs on main: the full test matrix, then a snapshot build of every release target only when all tests
# pass. Pull requests are covered by pr-gate.yml.
on:
  push:
    branches: [main]
  workflow_call: # release.yml runs these jobs before publishing

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser derives the version from tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lint the installer script
        run: make lint
      - uses: ./.github/actions/setup-goreleaser
      - name: build every release target
        run: make dist GORELEASER=goreleaser
      - uses: actions/upload-artifact@v4
        with:
          name: social-mcp-binaries
          path: |
            dist/bin/
            dist/SHA256SUMS
