name: release

# Pushing a tag like v1.2.3 tests, builds and publishes a GitHub Release with every binary, SHA256SUMS and
# the install scripts. A tag with a suffix (v1.2.3-rc.1) is published as a prerelease, which
# releases/latest and therefore the default install command ignore.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build every target
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/build-all.sh
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          flags=(--verify-tag --generate-notes --title "$TAG")
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* "${flags[@]}"
